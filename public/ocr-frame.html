<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCR</title>
  </head>
  <body>
    <!--
      Used by the phone app: it opens this page in a hidden WebView, sends a photo
      and gets the text back. Runs the same self-hosted engine and preparation
      step (ocr-pipeline.js) as the web app, inside the phone's WebView.
    -->
    <script src="/ocr/tesseract.min.js"></script>
    <script src="/ocr-pipeline.js"></script>
    <script>
      (function () {
        function send(msg) {
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
        }
        window.__ocr = function (msg) {
          MuthakaraOCR.recognize(msg.image, function (p) {
            send({ type: 'progress', id: msg.id, progress: p });
          }).then(
            function (text) {
              send({ type: 'result', id: msg.id, text: text });
            },
            function (e) {
              send({ type: 'error', id: msg.id, error: String(e && e.message ? e.message : e) });
            },
          );
        };
        window.__pdf = function (msg) {
          MuthakaraOCR.readPdf(msg.data, function (p, page) {
            send({ type: 'progress', id: msg.id, progress: p, page: page });
          }).then(
            function (r) {
              send({ type: 'pdf', id: msg.id, pages: r.pages, total: r.total });
            },
            function (e) {
              send({ type: 'error', id: msg.id, error: String(e && e.message ? e.message : e) });
            },
          );
        };
        // Warm up the engine and Arabic language file so the first photo is quick.
        MuthakaraOCR.warmUp().then(
          function () {
            send({ type: 'ready' });
          },
          function (e) {
            send({ type: 'failed', error: String(e) });
          },
        );
      })();
    </script>
  </body>
</html>
